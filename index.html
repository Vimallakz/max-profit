<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Max Profit</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 40px;
      }

      input {
        padding: 8px;
        width: 300px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }

      button {
        margin-left: 8px;
        padding: 8px 16px;
        border: none;
        border-radius: 4px;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }
    </style>
    <script src="index.js"></script>
  </head>
  <body>
    <input id="input" type="number" placeholder="Enter value" />
    <button type="button" id="submit" onclick="handleSubmit()">Submit</button>
    <p id="max-profit"></p>
    <p id="answers"></p>
    <script>
      function handleSubmit() {
        const value = document.getElementById('input').value;
        const { maxProfit, answers } = getSolutions(value);
        document.getElementById('max-profit').innerHTML = `Max Profit: ${maxProfit}`;
        document.getElementById('answers').innerHTML = `Answers: ${answers.map(answer => `{ ${Object.entries(answer).map(([key, value]) => `${key}: ${value}`).join(', ')} }`).join(', ')}`;
      }
    </script>
  </body>
</html>
